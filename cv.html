<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/cv.css">
  <!-- The CV is built from content.js — edit that file, not this one. -->
  <script src="content.js" defer></script>
  <script src="assets/cv.js" defer></script>
</head>
<body>
  <div class="toolbar">
    <a href="index.html">← Back to website</a>
    <button type="button" id="print-btn">Save as PDF</button>
  </div>

  <main class="page">
    <header class="cv-head">
      <h1 id="cv-name"></h1>
      <p class="cv-headline" id="cv-headline"></p>
      <p class="cv-contact" id="cv-contact"></p>
    </header>

    <section class="cv-section" id="sec-statement">
      <h2>Personal statement</h2>
      <p id="cv-statement"></p>
    </section>

    <section class="cv-section" id="sec-eligibility">
      <h2>Registration &amp; availability</h2>
      <dl class="cv-facts" id="cv-eligibility"></dl>
    </section>

    <section class="cv-section">
      <h2>Education &amp; qualifications</h2>
      <div id="cv-qualifications"></div>
    </section>

    <section class="cv-section">
      <h2>Professional experience</h2>
      <div id="cv-experience"></div>
    </section>

    <section class="cv-section" id="sec-clinical">
      <h2>Clinical experience</h2>
      <dl class="cv-facts cv-facts-wide" id="cv-clinical"></dl>
    </section>

    <section class="cv-section" id="sec-cpd">
      <h2>Courses &amp; CPD</h2>
      <div id="cv-cpd"></div>
    </section>

    <section class="cv-section cv-columns">
      <div id="sec-skills">
        <h2>Skills</h2>
        <ul class="cv-bullets" id="cv-skills"></ul>
      </div>
      <div id="sec-languages">
        <h2>Languages</h2>
        <ul class="cv-bullets" id="cv-languages"></ul>
      </div>
      <div id="sec-memberships">
        <h2>Memberships</h2>
        <ul class="cv-bullets" id="cv-memberships"></ul>
      </div>
    </section>

    <section class="cv-section" id="sec-references">
      <h2>References</h2>
      <p id="cv-references"></p>
    </section>
  </main>
</body>
</html>
